<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="8,000 sign-ups in 3 hours; Dragons' Den; Harrods exclusive launch; production AI for a leading neobank">
<style>@font-face{font-family:'J';font-weight:300;src:url(data:font/woff2;base64,) format('woff2')}
.big{font:300 33px 'J',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.08em;fill:#f5f5f7;text-anchor:middle}
.lab{font:300 15px 'J',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.3em;fill:#8b8b93;text-anchor:middle}
.fade{animation:in 1.2s ease backwards} @keyframes in{from{opacity:0}to{opacity:1}}
.n{animation:pulse 3s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="130" rx="14" fill="#050506"/>
<g class="fade" style="animation-delay:0.20s"><text x="150" y="64" class="big">8,000</text><text x="150" y="96" class="lab">SIGN-UPS IN 3 HOURS</text><circle cx="150" cy="112" r="2.2" fill="#7c9cff" class="n" style="animation-delay:0.0s"/></g><g class="fade" style="animation-delay:0.38s"><text x="450" y="64" class="big">DRAGONS' DEN</text><text x="450" y="96" class="lab">WEARABLE TECH FOUNDER</text><circle cx="450" cy="112" r="2.2" fill="#c58cff" class="n" style="animation-delay:0.6s"/></g><line x1="300" y1="32" x2="300" y2="100" stroke="rgba(255,255,255,.1)"/><g class="fade" style="animation-delay:0.56s"><text x="750" y="64" class="big">HARRODS</text><text x="750" y="96" class="lab">EXCLUSIVE LAUNCH</text><circle cx="750" cy="112" r="2.2" fill="#34d399" class="n" style="animation-delay:1.2s"/></g><line x1="600" y1="32" x2="600" y2="100" stroke="rgba(255,255,255,.1)"/><g class="fade" style="animation-delay:0.74s"><text x="1050" y="64" class="big">NEOBANK</text><text x="1050" y="96" class="lab">PRODUCTION AI CORE</text><circle cx="1050" cy="112" r="2.2" fill="#f6c453" class="n" style="animation-delay:1.7999999999999998s"/></g><line x1="900" y1="32" x2="900" y2="100" stroke="rgba(255,255,255,.1)"/>
<rect x=".5" y=".5" width="1199" height="129" rx="14" fill="none" stroke="rgba(255,255,255,.08)"/>
</svg>